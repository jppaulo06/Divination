name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pipx install poetry==1.6.1

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock', 'backend/pyproject.toml') }}

      - name: Install dependencies
        run: make ci-setup

      - name: Ruff lint
        run: make lint

      - name: Test portable CI runner
        run: make runner-tests

  monitoring-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pipx install poetry==1.6.1

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock', 'backend/pyproject.toml') }}

      - name: Install dependencies
        run: make ci-setup

      # Offline and deterministic: detectors are pure functions and the
      # store tests use in-memory SQLite, so no API keys are needed.
      - name: Run monitoring tests
        run: make monitoring

  unit-evals:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pipx install poetry==1.6.1

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock', 'backend/pyproject.toml') }}

      - name: Install dependencies
        run: make ci-setup

      - name: Run single-turn eval unit tests
        run: make eval
        env:
          CI_RUN_ID: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MARITACA_API_KEY: ${{ secrets.MARITACA_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          HOST: 0.0.0.0
          PORT: "8000"
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
          ALLOWED_METHODS: '["GET","POST"]'
          ALLOWED_HEADERS: '["*"]'
