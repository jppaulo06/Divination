name: Conversational Eval (multi-turn)

on:
  workflow_dispatch:
  schedule:
    # Monday 06:00 UTC; the portable runner skips evaluated commits.
    - cron: "0 6 * * 1"

concurrency:
  group: conversational-eval-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  conversational-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner owns the decision; Actions only persists its state.
      - name: Locate persisted evaluation state
        id: state
        uses: actions/github-script@v7
        with:
          script: |
            const pages = github.paginate.iterator(
              github.rest.actions.listArtifactsForRepo,
              {
                ...context.repo,
                name: `conversational-state-v1-${context.sha}`,
                per_page: 100,
              },
            );
            for await (const { data } of pages) {
              for (const artifact of data) {
                if (artifact.expired || artifact.workflow_run?.head_sha !== context.sha) continue;
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  ...context.repo,
                  run_id: artifact.workflow_run.id,
                });
                if (run.path !== '.github/workflows/conversational-eval.yml' ||
                    !['schedule', 'workflow_dispatch'].includes(run.event) ||
                    run.conclusion !== 'success') continue;
                core.setOutput('artifact-id', artifact.id);
                core.setOutput('run-id', run.id);
                return;
              }
            }

      - name: Restore evaluation state
        if: steps.state.outputs.artifact-id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.state.outputs.artifact-id }}
          run-id: ${{ steps.state.outputs.run-id }}
          github-token: ${{ github.token }}
          path: .ci-state
          merge-multiple: true

      - name: Check whether evaluation is needed
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            needed=$(python3 scripts/ci.py conversation-needed)
            echo "needed=$needed" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.needed == 'true'
        with:
          python-version: "3.10"

      - name: Install Poetry
        if: steps.check.outputs.needed == 'true'
        run: pipx install poetry==1.6.1

      - name: Cache Poetry virtualenv
        if: steps.check.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock', 'backend/pyproject.toml') }}

      - name: Install dependencies
        if: steps.check.outputs.needed == 'true'
        run: make ci-setup

      - name: Run multi-turn conversational eval suite
        if: steps.check.outputs.needed == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_RUN_ID: conversations-${{ github.run_id }}-${{ github.run_attempt }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MARITACA_API_KEY: ${{ secrets.MARITACA_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          HOST: 0.0.0.0
          PORT: "8000"
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
          ALLOWED_METHODS: '["GET","POST"]'
          ALLOWED_HEADERS: '["*"]'
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            make eval-conversations
          else
            make eval-conversations-if-changed
          fi

      # Renew the retained state even when the expensive suite was skipped.
      - name: Persist successful evaluation state
        uses: actions/upload-artifact@v4
        with:
          name: conversational-state-v1-${{ github.sha }}
          path: .ci-state/conversations.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
