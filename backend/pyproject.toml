[tool.poetry]
name = "D&D answerer"
version = "0.1"
description = "D&D answerer backend"
authors = ["Luiz Carlos <luizcarlosdk@usp.br>"]

[tool.poetry.dependencies]
python = "^3.10"
pydantic-settings = "^2.5.2"
langchain = "^0.3.3"
langchain-community = "^0.3.2"
langchainhub = "^0.1.21"
langchain-chroma = "^0.1.4"
bs4 = "^0.0.2"
langchain-openai = "^0.2.2"
python-dotenv = "^1.0.1"
fastapi = "^0.115.2"
pypdf = "^5.1.0"
onnxruntime = ">=1.14.0,<1.24"
uvicorn = "^0.32.0"

[tool.poetry.group.dev.dependencies]
deepeval = "^4.1.1"
ruff = ">=0.6.0"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
# Conservative default (unused imports, undefined names, syntax errors) —
# the codebase has no prior ruff history, so broader style rule sets
# (import sorting, naming, formatting-adjacent) would fail on unrelated
# pre-existing code rather than catch real bugs.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before importing modules that read env vars at
# import time (Settings, adapters) — imports-not-at-top is intentional.
"src/project/main.py" = ["E402"]
"tests/evals/chatbot_app.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]