server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    # woff2 is already compressed, so it is deliberately absent here.
    gzip_types text/css application/javascript application/json image/svg+xml;

    # vue-router uses history mode, so unknown paths must serve the shell
    # instead of returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The shell itself must always be revalidated, or a deploy would be
    # invisible to anyone holding a cached copy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
